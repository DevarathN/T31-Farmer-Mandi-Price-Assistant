function norm(s){return s.toLowerCase().replace(/[“”"'.,!?]/g," ").replace(/\s+/g," ").trim();}
function findEntity(q,map){
 const n=norm(q);
 for(const key in map) for(const alias of map[key]) if(n.includes(norm(alias))) return key;
 return null;
}
function canonCommodity(k){return k==="tur (arhar)"?"Tur (Arhar)":k? k[0].toUpperCase()+k.slice(1):null;}
function canonMarket(k){return k?k[0].toUpperCase()+k.slice(1):null;}
function rows(c,m){return DATA.filter(x=>x.commodity.toLowerCase()===c.toLowerCase() && x.market.toLowerCase()===m.toLowerCase()).sort((a,b)=>a.date.localeCompare(b.date));}
function money(x){return "₹"+Number(x).toLocaleString("en-IN");}
function isTrend(q){return /7.?day|trend|going up|going down|up or down|वाढ|कमी|ट्रेंड|गेल्या 7|पिछले 7/.test(norm(q));}
function isSellWait(q){return /sell|wait|विक|थांब|बेच|इंतजार|विकावी|थांबावे|बेचना/.test(norm(q));}
function exactDate(q){
 let m=q.match(/\b(20\d\d)[-\/](\d{1,2})[-\/](\d{1,2})\b/); if(m) return `${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
 const months={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12,जनवरी:1,फरवरी:2,मार्च:3,अप्रैल:4,मई:5,जून:6,जुलाई:7,अगस्त:8,सितंबर:9,अक्टूबर:10,नवंबर:11,दिसंबर:12};
 let x=norm(q).match(/\b(\d{1,2})\s+([a-zA-Z]+|जनवरी|फरवरी|मार्च|अप्रैल|मई|जून|जुलाई|अगस्त|सितंबर|अक्टूबर|नवंबर|दिसंबर)\s+(20\d\d)\b/);
 if(x && months[x[2]]) return `${x[3]}-${String(months[x[2]]).padStart(2,"0")}-${String(x[1]).padStart(2,"0")}`;
 return null;
}
function trendInfo(rs){
 const s=rs.slice(-7), start=s[0].modal, end=s[s.length-1].modal, ch=end-start, pct=ch/start*100;
 const label=Math.abs(pct)<2?"stable":pct>0?"increasing":"decreasing";
 return {s,start,end,ch,pct,label,avg:s.reduce((a,x)=>a+x.modal,0)/s.length};
}
function trendText(c,m,rs){
 const t=trendInfo(rs);
 return `${c} — ${m}
Latest available modal price: ${money(t.end)} per quintal
Latest date: ${t.s[t.s.length-1].date}

7-observation trend (${t.s[0].date} to ${t.s[t.s.length-1].date}):
• Starting modal price: ${money(t.start)} per quintal
• Latest modal price: ${money(t.end)} per quintal
• 7-observation average: ${money(Math.round(t.avg))} per quintal
• Change: ${t.ch>=0?"+":"-"}${money(Math.abs(t.ch)).replace("₹","₹")} per quintal
• Percentage change: ${t.pct>=0?"+":""}${t.pct.toFixed(2)}%
• Trend: ${t.label}`;
}
function sellText(c,m,rs){
 const t=trendInfo(rs);
 let g;
 if(t.label==="increasing") g=`The recent 7-observation trend is increasing, with the modal price rising from ${money(t.start)} to ${money(t.end)} (${t.pct>=0?"+":""}${t.pct.toFixed(2)}%). Based on this historical trend alone, waiting may be more favorable than selling immediately if the farmer can safely hold the produce and accept the risk of a price reversal. The data shows recent upward movement, but it does not predict that prices will continue to rise.`;
 else if(t.label==="decreasing") g=`The recent 7-observation trend is decreasing, with the modal price falling from ${money(t.start)} to ${money(t.end)} (${t.pct.toFixed(2)}%). Based on this historical trend alone, selling sooner may be more favorable than waiting because recent prices have been moving downward. However, prices can reverse, so this is not a guarantee that waiting will produce a lower price.`;
 else g=`The recent 7-observation trend is relatively stable, changing from ${money(t.start)} to ${money(t.end)} (${t.pct>=0?"+":""}${t.pct.toFixed(2)}%). There is no clear historical signal to strongly prefer selling now or waiting. The farmer can consider storage costs, perishability, cash needs and other market conditions rather than relying on the dataset alone.`;
 return trendText(c,m,rs)+`\n\nSell/wait interpretation: ${g}\n\nEducational interpretation only; not a price prediction or professional agricultural advice.`;
}
function reply(q){
 const cKey=findEntity(q,commodities), mKey=findEntity(q,markets);
 if(!cKey && !mKey) return "Please provide a commodity and Maharashtra market so I can check the supplied Mandi Prices dataset.";
 if(!cKey) return "I identified the market, but I need the commodity to answer accurately from the supplied dataset.";
 if(!mKey) return "I identified the commodity, but I need the Maharashtra market to answer accurately from the supplied dataset.";
 const c=canonCommodity(cKey),m=canonMarket(mKey),rs=rows(c,m);
 if(!rs.length) return `${c} in ${m} is unavailable in the supplied dataset. I cannot provide a price because there is no matching record.`;
 const d=exactDate(q);
 if(d){
   const hit=rs.find(x=>x.date===d);
   if(!hit) return `No matching ${c} record is available for ${m} on ${d} in the supplied dataset. I will not substitute another date.`;
   return `${c} — ${m}\nHistorical modal price: ${money(hit.modal)} per quintal\nDate of data: ${hit.date}\nPrice range: ${money(hit.min)} to ${money(hit.max)} per quintal\nArrivals: ${hit.arrivals.toLocaleString("en-IN")} quintal\n\nSource: supplied Mandi Prices dataset.`;
 }
 if(isSellWait(q)) return sellText(c,m,rs);
 if(isTrend(q)) return trendText(c,m,rs);
 const current=/today|current|right now|आज|अभी|वर्तमान|सध्याचा|आजचा|आत्ताचा/.test(norm(q));
 if(current){
   const latest=rs[rs.length-1];
   return `Today's/current live price is unavailable from the supplied dataset because the dataset ends on 28-Feb-2026.\n\nLatest historical record:\n${c} — ${m}\nModal price: ${money(latest.modal)} per quintal\nDate of data: ${latest.date}\nPrice range: ${money(latest.min)} to ${money(latest.max)} per quintal\n\nSource: supplied Mandi Prices dataset. This is historical data, not a live quote.`;
 }
 const latest=rs[rs.length-1];
 return `${c} — ${m}\nLatest available modal price: ${money(latest.modal)} per quintal\nDate of data: ${latest.date}\nPrice range: ${money(latest.min)} to ${money(latest.max)} per quintal\nArrivals: ${latest.arrivals.toLocaleString("en-IN")} quintal\n\nSource: supplied Mandi Prices dataset. This is the latest available record, not a live market quote.`;
}
function add(text,cls){const d=document.createElement("div");d.className="msg "+cls;d.textContent=text;document.getElementById("chat").appendChild(d);document.getElementById("chat").scrollTop=999999;}
function ask(){const q=document.getElementById("q").value.trim();if(!q)return;add(q,"user");add(reply(q),"bot");document.getElementById("q").value="";}
function fill(x){document.getElementById("q").value=x;ask();}
add("Hello! I answer mandi-price questions using only the supplied dataset. Ask for a latest price, an exact historical date, a 7-observation trend, or a sell/wait educational interpretation.","bot");
</script>
